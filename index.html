<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0f" />

    <meta property="og:site_name" content="Lumoflix" />
    <meta property="og:title" content="Lumoflix — Watch Movies & TV Shows" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Lumo" />
    <title>Lumoflix — Watch Movies & TV Shows</title>
    <!-- Tells Google the site's name for search results -->

      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Lumoflix",
        "alternateName": ["Lumo", "lumoflix.xyz"],
        "url": "https://lumoflix.xyz/"
